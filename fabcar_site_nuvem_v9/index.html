<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#04060c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FAB Car">
<title>FAB Car</title>
<style>
:root{--bg:#070b12;--card:#101827;--card2:#162136;--line:#22304a;--tx:#e8eefc;--mut:#7f8fae;--on:#27e08a;--amb:#ffb020;--hi:#5cc8ff;--bad:#ff4d5e;--acc:#6c8cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100dvh;padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 190px);max-width:560px;margin:auto}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 6px}
header h1{font-size:18px;margin:0;letter-spacing:.5px}
header h1 b{color:var(--acc)}
.st{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut)}
.dot.ok{background:var(--on);box-shadow:0 0 8px var(--on)}
.ib{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;border:1px solid var(--line)}
.ib svg,.tile svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stage{position:relative;background:radial-gradient(120% 90% at 50% 40%,#16213a 0,#0b111d 70%);border:1px solid var(--line);border-radius:26px;padding:6px 0 10px;overflow:hidden}
#car{width:100%;height:330px;display:block}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 10px}
.g{text-align:center;position:relative}
.g svg{width:100%;height:78px}
.g .v{position:absolute;left:0;right:0;top:34px;font-size:22px;font-weight:700}
.g .l{font-size:11px;color:var(--mut);margin-top:-6px}
.chips{display:flex;gap:8px;padding:8px 10px 0;flex-wrap:wrap}
.chip{flex:1;min-width:30%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:12px;color:var(--mut)}
.chip b{display:block;font-size:16px;color:var(--tx)}
.obd{position:absolute;top:18px;left:14px;font-size:11px;color:var(--mut);display:flex;gap:6px;align-items:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;transition:.2s;min-height:96px;text-align:left}
.tile.on{border-color:var(--on);box-shadow:0 0 0 1px var(--on) inset,0 0 22px #27e08a22}
.tile.hi{border-color:var(--hi);box-shadow:0 0 0 1px var(--hi) inset,0 0 22px #5cc8ff33}
.tile .t{font-size:13px;color:var(--mut)}
.tile .s{font-size:17px;font-weight:700}
.tile.wide{grid-column:span 2}
.seg{display:flex;gap:4px;background:#0b111d;border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-size:13px;color:var(--mut)}
.seg button.a{background:var(--acc);color:#fff}
.vol{display:flex;align-items:center;gap:10px}
.vol button{width:40px;height:40px;border-radius:12px;background:var(--card2);font-size:20px}
.vol .bar{flex:1;height:8px;border-radius:5px;background:#0b111d;overflow:hidden}
.vol .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--hi));width:0}
.slide{position:relative;height:56px;border-radius:28px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.slide span{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;color:var(--mut);pointer-events:none}
.slide input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:grab}
.slide .knob{position:absolute;left:4px;top:4px;width:48px;height:48px;border-radius:50%;background:var(--acc);display:grid;place-items:center;pointer-events:none}
.slide.run{background:#12331f;border-color:var(--on)}
.slide.run .knob{background:var(--on)}
.voz{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,#070b1200,#070b12 22%);padding:26px 14px calc(env(safe-area-inset-bottom) + 12px);z-index:5}
.voz .in{max-width:560px;margin:auto}
.hist{font-size:13px;color:var(--mut);min-height:34px;margin-bottom:8px;text-align:center}
.hist b{color:var(--tx)}
.row{display:flex;gap:8px;align-items:center}
.orb{flex:none;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8aa4ff,#4a63e0);display:grid;place-items:center;box-shadow:0 0 0 0 #6c8cff66}
.orb svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}
.orb.on{animation:pulse 1.1s infinite;background:radial-gradient(circle at 35% 30%,#6bf0b0,#17b56c)}
@keyframes pulse{70%{box-shadow:0 0 0 18px #27e08a00}0%{box-shadow:0 0 0 0 #27e08a77}}
.row input[type=text]{flex:1;height:46px;border-radius:23px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:0 16px;font-size:15px;min-width:0}
.sug{display:flex;gap:6px;overflow-x:auto;padding:8px 0 0;scrollbar-width:none}
.sug button{flex:none;font-size:12px;padding:7px 11px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--mut)}
.conf{display:none;gap:8px;margin-bottom:8px}.conf.s{display:flex}
.conf button{flex:1;padding:12px;border-radius:14px;font-weight:700}
.conf .y{background:var(--on);color:#04210f}.conf .n{background:var(--card2)}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:10}
.sheet.s{display:flex}
.sheet>div{background:var(--card);width:100%;max-width:560px;margin:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:85dvh;overflow:auto}
.sheet h3{margin:0 0 12px}
.sheet label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
.sheet input[type=text],.sheet input[type=password]{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:#0b111d;color:var(--tx);padding:0 12px;font-size:14px}
.win{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:14px}
.win span{width:96px}.win input{flex:1}
.btn{padding:12px 16px;border-radius:14px;background:var(--acc);font-weight:700;margin-top:14px;width:100%}
.btn.g2{background:var(--card2)}
/* foto */
.ph{position:relative;margin:44px 12px 6px;border-radius:18px;overflow:hidden;line-height:0;background:#000}
.ph img{width:100%;display:block;filter:brightness(.72) saturate(.9);transition:filter .4s}
.ph.f1 img,.ph.f2 img{filter:brightness(.62) saturate(.9)}
.ph .gl{position:absolute;border-radius:50%;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;transform:translate(-50%,-50%);mix-blend-mode:screen}
.ph .lw{width:19%;aspect-ratio:1;background:radial-gradient(circle,#fffbe0 0,#fff2a8 25%,#ffe27a55 55%,#0000 72%)}
.ph .lh{width:34%;aspect-ratio:1;background:radial-gradient(circle,#ffffff 0,#cfeeff 25%,#7cc8ff66 55%,#0000 72%)}
.ph.f1 .lw{opacity:.85}.ph.f2 .lw{opacity:1;transform:translate(-50%,-50%) scale(1.15)}.ph.f2 .lh{opacity:.9}
.ph .pk{width:7%;aspect-ratio:1;background:radial-gradient(circle,#ffb020 0,#ff9a0099 45%,#0000 72%)}
.ph.pisca .pk{animation:bl2 .8s steps(1) infinite}
@keyframes bl2{50%{opacity:1}}
.ph .dm2{left:52%;top:30%;width:34%;height:24%;border-radius:50%;background:radial-gradient(ellipse,#ffd98a 0,#ffd98a55 50%,#0000 75%);transform:translate(-50%,-50%)}
.ph.dome .dm2{opacity:.75}
.ph.motor img{animation:shk .12s linear infinite}
@keyframes shk{0%{transform:translate(0,0)}50%{transform:translate(.6px,.6px)}100%{transform:translate(-.6px,0)}}
.badge{position:absolute;left:10px;top:10px;line-height:1;font-size:12px;padding:6px 10px;border-radius:12px;background:#000a;color:var(--amb);display:flex;gap:6px;align-items:center}
.badge.l{color:var(--on)}
.eq{position:absolute;right:10px;top:10px;display:none;gap:3px;align-items:flex-end;height:20px;background:#000a;padding:6px 8px;border-radius:10px;box-sizing:content-box}
.ph.som .eq{display:flex}
.eq i{width:4px;background:var(--hi);border-radius:2px;animation:eq 0.8s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:4px}50%{height:20px}}
.vt{position:absolute;right:14px;top:14px;z-index:2;font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:12px}
#car{display:none}.top #car{display:block}.top .ph{display:none}
/* carro */
#car .body{fill:#1b2740;stroke:#3a4d75;stroke-width:2}
#car .roof{fill:#223052}
#car .glass{fill:#0e1626;stroke:#2c3d63;stroke-width:1}
#car .door{fill:none;stroke:#3a4d75;stroke-width:1.5}
#car .wg{fill:#5cc8ff;opacity:.18}
#car .lamp{fill:#2a3552}
#car .tail{fill:#5a1620}
#car .beam{opacity:0;transition:opacity .25s}
#car .beamH{opacity:0;transition:opacity .25s}
#car .lk{fill:var(--mut)}
#car .dome{fill:#ffd98a;opacity:0;transition:.25s}
#car .hz{fill:#ffb020;opacity:0}
#car .ring{fill:none;stroke:var(--acc);opacity:0;stroke-width:2}
#car .heat{fill:#ff6a3d;opacity:0;transition:opacity .5s}
#car.f1 .beamL,#car.f2 .beamL{opacity:1}
#car.f2 .beamH{opacity:1}
#car.f1 .lamp,#car.f2 .lamp{fill:#fff6c9}
#car.f1 .tail,#car.f2 .tail{fill:#ff3b4d}
#car.dome .dome{opacity:.55}
#car.pisca .hz{animation:bl .8s steps(1) infinite}
@keyframes bl{50%{opacity:1}}
#car.motor .heat{opacity:.25}
#car.som .ring{animation:rg 1.4s infinite}
#car.som .ring.r2{animation-delay:.45s}
@keyframes rg{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(1.6)}}
#car .ring{transform-box:fill-box;transform-origin:center}
#car .d.open{stroke:var(--amb)}
#car .lk.u{fill:var(--amb)}
#car.lock .lk{fill:var(--on)}

/* ===== v4: showroom ===== */
html,body{height:100dvh;overflow:hidden;overscroll-behavior:none}
body{padding:0;max-width:none;background:#04060c;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;--card:#0c1426;--line:#ffffff2a;--mut:#8fa0c4;--acc:#4aa8ff}
.app{position:relative;height:100dvh;display:grid;gap:8px;padding:0 10px calc(env(safe-area-inset-bottom) + 6px);
  grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto auto;grid-template-areas:"tb" "st" "L" "R" "vz"}
.app>*{position:relative;z-index:1}
/* garagem */
.garage{position:absolute!important;inset:0;z-index:0!important;overflow:hidden;background:linear-gradient(#0c1327 0,#080d1b 52%,#0b1122 53%,#04060b 100%)}
.garage::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#0000 0 110px,#ffffff09 110px 112px),radial-gradient(ellipse at 50% 30%,#2a4a8a33,transparent 60%)}
.garage .floor{position:absolute;left:0;right:0;top:53%;bottom:0;background:radial-gradient(ellipse at 12% 8%,#ff3a2e55,transparent 30%),radial-gradient(ellipse at 88% 10%,#ff3a2e44,transparent 28%),radial-gradient(ellipse at 50% 0,#4aa8ff44,transparent 60%),linear-gradient(#ffffff0d,transparent 40%)}
.ls{position:absolute;height:3px;border-radius:2px;background:#cfe9ff;box-shadow:0 0 10px #8fd0ff,0 0 24px #4aa8ff}
.ls.a{top:20%;left:6%;width:14%}.ls.b{top:22%;left:66%;width:18%}.ls.c{top:52%;left:3%;width:12%;background:#ff4a3d;box-shadow:0 0 10px #ff4a3d,0 0 22px #ff2a1a}
.ls.d{top:52%;right:3%;width:14%;background:#ff4a3d;box-shadow:0 0 10px #ff4a3d,0 0 22px #ff2a1a}.ls.e{top:17%;left:40%;width:10%}.ls.f{top:19%;right:2%;width:5%;background:#ff9a4a;box-shadow:0 0 10px #ff9a4a}
.wall{position:absolute;right:8%;top:14%;font:italic 900 clamp(60px,15vw,170px)/1 "Segoe UI",system-ui,sans-serif;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:2px #5ab4ff;text-shadow:0 0 18px #2f7bff,0 0 40px #2f7bff88;opacity:.55;pointer-events:none;transform:skewX(-6deg)}
/* topo */
.tb{grid-area:tb;display:flex;align-items:center;gap:14px;margin:0 -10px;padding:calc(env(safe-area-inset-top) + 6px) 12px 6px;background:linear-gradient(#000d,#0000)}
.logo{display:flex;align-items:baseline;gap:6px;flex:none;line-height:1}
.logo b{font:italic 900 20px "Segoe UI",system-ui;letter-spacing:-.02em}.logo span{font:italic 300 20px "Segoe UI",system-ui;color:#7fc4ff}
.logo small{display:none;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin-left:4px}
.tbi{display:flex;align-items:center;gap:7px;padding-left:12px;border-left:1px solid #ffffff22;min-width:0}
.tbi>div{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.tbi small{font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut)}
.tbi b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbs{flex:1}.tbi.clk{text-align:right}.tbi.clk b{font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;background:#5b6784;flex:none}.dot.ok{background:#4aff9a;box-shadow:0 0 8px #4aff9a}
.ib{width:32px;height:32px;border-radius:50%;background:#0c1426cc;border:1px solid var(--line);flex:none}
.ib svg{width:17px;height:17px;stroke:#cfe0ff}
/* palco */
.stage{grid-area:st;position:relative;display:flex;min-height:0;padding:0;border:0;border-radius:0;background:none;overflow:visible;clip-path:none;box-shadow:none}
.stage::before,.stage::after{display:none}
.vt{position:absolute;top:0;right:0;z-index:6;padding:5px 10px;font-size:10px;border-radius:14px;background:#0c1426cc;border:1px solid var(--line);color:#cfe0ff;text-transform:uppercase;letter-spacing:1px}
.carbox{flex:1;min-height:0;position:relative;container-type:size;display:grid;place-items:end center}
.ring{position:absolute;left:50%;bottom:2cqh;width:min(100cqw,150cqh);height:26cqh;transform:translateX(-50%);border-radius:50%;border:3px solid #fff;
  box-shadow:0 0 6px #fff,0 0 22px #6cc0ff,inset 0 0 22px #6cc0ff66;background:radial-gradient(ellipse,#6cc0ff22,#0000 70%)}
.ph{position:relative;margin:0 0 13cqh;width:min(94cqw,calc(78cqh * 2.376));aspect-ratio:853/359;background:none;border-radius:0;overflow:visible}
.ph img{width:100%;height:100%;display:block;filter:brightness(.95) saturate(1.08);-webkit-box-reflect:below -2% linear-gradient(transparent 62%,#0006)}
.ph.f1 img,.ph.f2 img{filter:brightness(.82) saturate(1.08)}
.ph .lw{width:6.5%}.ph .lh{width:11%}.ph .pk{width:5%}.ph .dm2{left:66%;top:18.2%;width:22%;height:24.9%}
.badge{left:0;top:auto;bottom:0;font-size:10px;padding:5px 9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;background:#050a14cc;border:1px solid var(--line);border-radius:12px;color:#ffc34a}
.badge.l{color:#4aff9a}.eq{right:0;top:auto;bottom:0;border-radius:10px;background:#050a14cc}
#car{display:none;position:absolute;inset:0;margin:auto;height:100%;width:auto;z-index:3}
.top #car{display:block}.top .ph{visibility:hidden}
/* painel de informações */
.L{grid-area:L;display:flex;align-items:center;gap:10px;min-width:0}
.info .nm{display:none}
.stats{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;min-width:0}
.stats>div{background:#0a1224bb;border:1px solid #ffffff1f;border-radius:10px;padding:6px 4px;text-align:center;min-width:0}
.stats label{display:block;font-size:8px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:clip}
.stats b{display:block;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats .lg{display:none}.stats .sh{display:inline}.stats u{display:none;text-decoration:none;font-size:9px;color:var(--mut)}
#tMotor{order:-1;flex:none;background:none!important;border:0!important;box-shadow:none!important;padding:0!important;backdrop-filter:none}
#tMotor .tx{display:none}
/* menu */
.R{grid-area:R;display:grid;grid-template-columns:1fr 1fr;gap:6px;min-width:0}
.duo{display:contents}
#tFarol,#tSom{grid-column:span 2}
.tile{display:flex;flex-direction:row;align-items:center;gap:8px;min-height:0;padding:7px 10px;border-radius:11px;color:#eaf1ff;text-align:left;min-width:0;
  background:linear-gradient(180deg,#0f1a33cc,#0a1224d9);border:1px solid #ffffff26;backdrop-filter:blur(6px);transition:.15s}
.tile:active{transform:scale(.98)}
.tile .i{flex:none;width:20px;height:20px;stroke:#8fa0c4;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile .tx{min-width:0}
.tile .t{font-size:10px;color:#8fa0c4;text-transform:uppercase;letter-spacing:.8px;white-space:nowrap}
.tile .s{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.on{border-color:#4aa8ff;background:linear-gradient(180deg,#14325fe0,#0d1f3fe0);box-shadow:0 0 0 1px #4aa8ff inset,0 0 16px #4aa8ff44}
.tile.on .i{stroke:#8fd0ff;filter:drop-shadow(0 0 4px #4aa8ff)}
.tile.hi{border-color:#7fe3ff;background:linear-gradient(180deg,#144a63e0,#0d2a3fe0);box-shadow:0 0 0 1px #7fe3ff inset,0 0 18px #7fe3ff55}
.tile.hi .i{stroke:#bff3ff;filter:drop-shadow(0 0 4px #7fe3ff)}
#tFarol,#tSom{flex-direction:column;align-items:stretch;gap:5px}
.row1{display:flex;align-items:center;gap:8px}.row1 .t{flex:1}
.seg{display:flex;gap:3px;padding:2px;border-radius:9px;background:#050a14}
.seg button{flex:1;padding:6px 0;font-size:11px;border-radius:7px;color:#8fa0c4}
.seg button.a{background:#2f7bff;color:#fff;font-weight:600;box-shadow:0 0 10px #2f7bff88}
.mini{padding:4px 10px;font-size:11px;border-radius:8px;background:#050a14;border:1px solid var(--line);color:#8fd0ff;text-transform:uppercase;letter-spacing:.8px}
.vol{display:flex;align-items:center;gap:7px}.vol button{width:30px;height:28px;border-radius:8px;font-size:16px;background:#050a14;border:1px solid var(--line);color:#fff}
.vol .bar{flex:1;height:8px;border-radius:5px;background:#050a14;border:1px solid var(--line);overflow:hidden;cursor:pointer}
.vol .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2f7bff,#8fd0ff)}
.vol .s{font-size:12px;min-width:34px;text-align:right}
/* partida */
.start{--p:0deg;flex:none;width:64px;height:64px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#eaf1ff;touch-action:none;user-select:none;-webkit-user-select:none;position:relative;
  background:radial-gradient(circle at 50% 30%,#1c2f5c,#0a1224 72%);box-shadow:0 0 14px #4aa8ff55,inset 0 0 12px #4aa8ff33}
.start::before{content:"";position:absolute;inset:0;border-radius:50%;padding:3px;background:conic-gradient(#fff var(--p),#4aa8ff88 0);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.start svg{width:22px;height:22px;stroke:#8fd0ff;fill:none;stroke-width:2.2;stroke-linecap:round}.start b{font-size:9px;letter-spacing:1.5px}
.start.run{background:radial-gradient(circle at 50% 30%,#1f6a50,#0a2a22 72%);box-shadow:0 0 18px #4aff9a88}.start.run svg{stroke:#4aff9a}.start.run::before{background:conic-gradient(#4aff9a var(--p),#4aff9a 0)}
/* voz */
.voz{grid-area:vz;position:static;padding:0;background:none}.voz .in{max-width:none}
.hist{min-height:0;height:16px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px;margin-bottom:5px;color:#8fa0c4;text-align:left}
.hist b{color:#fff}
.orb{width:44px;height:44px;flex:none;background:radial-gradient(circle at 35% 30%,#8fd0ff,#2f7bff)}

/* ===== v5: mais videogame, botões 3D, giro, fumaça ===== */
.stage::before{display:block!important;content:"";position:absolute;inset:0;pointer-events:none;z-index:4;
  background:linear-gradient(#7fc4ff,#7fc4ff) top left/22px 2px no-repeat,linear-gradient(#7fc4ff,#7fc4ff) top left/2px 22px no-repeat,
  linear-gradient(#7fc4ff,#7fc4ff) top right/22px 2px no-repeat,linear-gradient(#7fc4ff,#7fc4ff) top right/2px 22px no-repeat,
  linear-gradient(#7fc4ff,#7fc4ff) bottom left/22px 2px no-repeat,linear-gradient(#7fc4ff,#7fc4ff) bottom left/2px 22px no-repeat,
  linear-gradient(#7fc4ff,#7fc4ff) bottom right/22px 2px no-repeat,linear-gradient(#7fc4ff,#7fc4ff) bottom right/2px 22px no-repeat;opacity:.7}
.ring svg{position:absolute;inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px);overflow:visible}
.ring .dash{animation:dsh 2.4s linear infinite;filter:drop-shadow(0 0 4px #5ab4ff)}
@keyframes dsh{to{stroke-dashoffset:-28}}
.ring{background:radial-gradient(ellipse,#6cc0ff33,#0000 72%),repeating-conic-gradient(from 0deg,#ffffff10 0 6deg,#0000 6deg 12deg)}
.carbox{perspective:none}
.ph{transform-style:flat;will-change:transform}
.ph img{filter:contrast(1.12) saturate(1.3) brightness(1.02) drop-shadow(0 0 2px #9fd8ff) drop-shadow(0 0 16px #2f7bffaa)}
.ph.f1 img,.ph.f2 img{filter:contrast(1.12) saturate(1.3) brightness(.88) drop-shadow(0 0 2px #9fd8ff) drop-shadow(0 0 16px #2f7bffaa)}
.shine{position:absolute;inset:0;pointer-events:none;-webkit-mask:var(--car) center/100% 100% no-repeat;mask:var(--car) center/100% 100% no-repeat;
  background:linear-gradient(105deg,transparent 42%,#ffffffb0 50%,transparent 58%) 150% 0/250% 100% no-repeat;animation:shn 3.6s ease-in-out infinite;mix-blend-mode:screen}
@keyframes shn{0%{background-position:150% 0}60%,100%{background-position:-50% 0}}
/* fumaça */
.smoke{position:absolute;left:94%;top:78%;width:0;height:0;pointer-events:none;z-index:3}
.smoke i{position:absolute;left:0;top:0;width:26cqw;max-width:150px;aspect-ratio:1;margin:-10cqw 0 0 -10cqw;border-radius:50%;opacity:0;filter:blur(4px);
  background:radial-gradient(circle,#f2f5fae6 0,#b9c1d1b3 45%,#0000 70%);animation:puff 2.8s ease-out infinite;animation-play-state:paused;--dx:90px;--dy:-60px}
.ph.motor .smoke i{animation-play-state:running}
.smoke i:nth-child(1){animation-delay:0s}.smoke i:nth-child(2){animation-delay:.4s;--dx:95px;--dy:-60px}.smoke i:nth-child(3){animation-delay:.8s;--dx:55px;--dy:-100px}
.smoke i:nth-child(4){animation-delay:1.2s;--dx:110px;--dy:-85px}.smoke i:nth-child(5){animation-delay:1.6s;--dx:75px;--dy:-65px}
.smoke i:nth-child(6){animation-delay:2s;--dx:90px;--dy:-105px}.smoke i:nth-child(7){animation-delay:2.4s;--dx:60px;--dy:-75px}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.3)}10%{opacity:.95}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(2.6)}}
.ph.burst .smoke i{animation-duration:1.3s;filter:blur(3px) brightness(.8)}
.ph.burst img{animation:shk .08s linear infinite}
/* OBD maior */
.stats label{font-size:9px}.stats b{font-size:20px}
.stats>div{position:relative;padding:9px 4px 11px}
.stats .bar{position:absolute;left:6px;right:6px;bottom:3px;height:3px;border-radius:2px;background:#ffffff14;overflow:hidden}
.stats .bar s{display:block;height:100%;width:0;background:linear-gradient(90deg,#2f7bff,#8fd0ff);transition:width .15s}
/* botões com cara de botão */
.tile{position:relative;border-radius:14px;border:1px solid #6f8bc8;border-bottom-color:#2a3b66;
  background:linear-gradient(180deg,#3a4f82 0%,#223460 48%,#16224a 100%);
  box-shadow:0 4px 0 #060b1c,0 8px 14px #000a,inset 0 1px 0 #ffffff55,inset 0 -10px 14px #0005;backdrop-filter:none;margin-bottom:4px;transition:transform .08s,box-shadow .08s,background .15s}
button.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #060b1c,0 3px 6px #000a,inset 0 2px 8px #000a}
.tile::after{content:"";position:absolute;top:7px;right:9px;width:7px;height:7px;border-radius:50%;background:#10172e;box-shadow:inset 0 1px 2px #000,0 0 0 1px #5a74b055}
.tile.on{background:linear-gradient(180deg,#5b9dff 0%,#2f68d0 48%,#1e46a0 100%);border-color:#b8dcff;border-bottom-color:#1a3a80;box-shadow:0 4px 0 #0a1f55,0 8px 18px #2f7bff66,inset 0 1px 0 #ffffffaa,inset 0 -10px 14px #0a1f5566}
.tile.on::after{background:#c8f5ff;box-shadow:0 0 8px #8fe0ff,0 0 16px #4aa8ff}
.tile.hi{background:linear-gradient(180deg,#5ad0f0 0%,#1f93b8 48%,#126985 100%);border-color:#c8f5ff;border-bottom-color:#0a4a60;box-shadow:0 4px 0 #063a4c,0 8px 18px #3df0ff55,inset 0 1px 0 #ffffffaa,inset 0 -10px 14px #06384a66}
.tile.hi::after{background:#e8ffff;box-shadow:0 0 8px #8ff8ff,0 0 16px #3df0ff}
.tile.on .t,.tile.hi .t{color:#e3f0ff}.tile.on .i,.tile.hi .i{stroke:#fff}
.tile .s{text-shadow:0 1px 0 #0006}
.seg{background:#060b1c;box-shadow:inset 0 2px 6px #000}
.seg button{background:linear-gradient(180deg,#34477a,#1b2a54);border:1px solid #5a74b0;border-bottom-color:#2a3b66;box-shadow:0 2px 0 #060b1c,inset 0 1px 0 #ffffff40;color:#dbe6ff;margin:0 1px 2px;transition:transform .08s}
.seg button:active{transform:translateY(2px);box-shadow:none}
.seg button.a{background:linear-gradient(180deg,#6fb0ff,#2f68d0);border-color:#c8e4ff;color:#fff;box-shadow:0 2px 0 #0a1f55,0 0 12px #2f7bffaa,inset 0 1px 0 #fff9}
.mini,.vol button,.auto,.sug button{background:linear-gradient(180deg,#34477a,#1b2a54);border:1px solid #5a74b0;border-bottom-color:#2a3b66;box-shadow:0 3px 0 #060b1c,inset 0 1px 0 #ffffff40;color:#e8f0ff}
.mini:active,.vol button:active,.auto:active,.sug button:active{transform:translateY(2px);box-shadow:0 1px 0 #060b1c}
.auto.a{background:linear-gradient(180deg,#1f8f62,#0f5a3f);border-color:#7dffc0;color:#eafff4}
.start{box-shadow:0 5px 0 #04070f,0 9px 16px #000a,0 0 16px #4aa8ff66,inset 0 2px 0 #ffffff55,inset 0 -8px 12px #0006;background:radial-gradient(circle at 50% 28%,#3a5aa8,#14214a 72%);margin-bottom:5px;transition:transform .08s,box-shadow .08s}
.start:active{transform:translateY(3px);box-shadow:0 2px 0 #04070f,0 3px 8px #000a,inset 0 3px 10px #000a}
.start.run{background:radial-gradient(circle at 50% 28%,#35c88a,#0d4a35 72%);box-shadow:0 5px 0 #03150e,0 9px 16px #000a,0 0 20px #4aff9a99,inset 0 2px 0 #ffffff66,inset 0 -8px 12px #0006}
.orb{box-shadow:0 4px 0 #0a1f55,0 6px 12px #000a,inset 0 2px 0 #fff6}
@media (min-aspect-ratio:13/10){
  .app{grid-template-columns:minmax(220px,29%) minmax(0,1fr) minmax(210px,26%);gap:6px 12px}
  .info .nm{display:flex;align-items:center;gap:10px;margin-bottom:2px}.nm small{display:none!important}.nm b{font-size:20px;margin:0}
  .L{gap:6px;padding-top:2px}
  .stats{padding:0 12px}
  .stats>div{padding:6px 0 8px}

}

/* v6.2: imagem estilo game + fumaça por baixo do carro */
.ph img{position:relative;z-index:1;filter:contrast(1.05) saturate(1.1) drop-shadow(0 0 2px #9fd8ff) drop-shadow(0 0 14px #2f7bffaa)}

/* ===== v7: nova interface ===== */
/* START sem a linha: anel SVG de progresso */
.start::before{display:none!important}
.start{width:72px;height:72px;border:2px solid #5d7fd6;background:radial-gradient(circle at 50% 28%,#35508f,#0f1a3a 72%)}
.start svg.rg{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);transform:rotate(-90deg);fill:none;stroke-width:4;pointer-events:none}
.start svg.rg .rb{stroke:#1b2a55}
.start svg.rg .rp{stroke:#8fe3ff;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;filter:drop-shadow(0 0 4px #4cc9ff)}
.start.run svg.rg .rp{stroke:#4aff9a;stroke-dashoffset:0!important;filter:drop-shadow(0 0 5px #4aff9a)}
.start.run{border-color:#b6ffd9;animation:go 1.8s ease-in-out infinite}
@keyframes go{0%,100%{box-shadow:0 5px 0 #03150e,0 0 16px #4aff9a88}50%{box-shadow:0 5px 0 #03150e,0 0 34px #4aff9aee}}
#tMotor .start{width:64px;height:64px}
.start b{font-size:10px}

.ph .lh{width:40%;background:radial-gradient(circle,#fff 0,#e4f6ff 24%,#8fd3ff99 52%,#0000 74%)}
.ph .lw{width:23%;background:radial-gradient(circle,#fffdf0 0,#fff4b0 28%,#ffe27a88 56%,#0000 74%)}
.ph.f1 .lw{opacity:1}.ph.f2 .lh{opacity:1}
.ph.f2 img{filter:contrast(1.08) saturate(1.3) brightness(.95) drop-shadow(0 0 3px #cfeeff) drop-shadow(0 0 22px #5fb8ffee)}
/* pisca-alerta bem visível */

.ph.pisca .pk{animation:bl3 .8s steps(1) infinite}
@keyframes bl3{0%{opacity:1}50%{opacity:.04}100%{opacity:1}}
#tPisca.on{background:linear-gradient(180deg,#ffc447,#e07b00);border-color:#ffe2a0;box-shadow:0 4px 0 #6b3a00,0 0 30px #ffb020cc,0 0 56px #ffb02077,inset 0 1px 0 #ffffff88}
#tPisca.on .t,#tPisca.on .s{color:#2a1700;text-shadow:none}
#tPisca.on .i{stroke:#2a1700;filter:none;animation:bl3 .8s steps(1) infinite}
#tFarol.hi{background:linear-gradient(180deg,#e6f6ff,#7cc8ff);box-shadow:0 4px 0 #3a7db3,0 0 30px #bfe6ff,0 0 56px #7cc8ffaa,inset 0 1px 0 #fff}
#tFarol.hi .t,#tFarol.hi .i{color:#06213f;stroke:#06213f}
#tFarol.on{box-shadow:0 4px 0 #0a1f55,0 0 26px #5fb8ffcc,inset 0 1px 0 #ffffffaa}
/* vidros: 4 botões */
#tVid{flex-direction:column;align-items:stretch;gap:6px}
#tVid .vh{display:flex;align-items:center;gap:6px}
#tVid .vh .t{flex:1}
#tVid .vh .mini{padding:3px 8px;font-size:10px}
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wb{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:3px;padding:6px 2px 5px;min-height:56px;border-radius:12px;color:#eaf1ff;min-width:0;
  background:linear-gradient(180deg,#34477a,#1b2a54);border:1px solid #5a74b0;border-bottom-color:#2a3b66;box-shadow:0 3px 0 #060b1c,inset 0 1px 0 #ffffff40;transition:transform .08s,box-shadow .08s,background .2s}
.wb:active{transform:translateY(2px);box-shadow:0 1px 0 #060b1c}
.wb.o{background:linear-gradient(180deg,#5b9dff,#1e46a0);border-color:#b8dcff;box-shadow:0 3px 0 #0a1f55,0 0 18px #4aa8ffaa,inset 0 1px 0 #ffffffaa}
.wb .pn{position:relative;width:30px;height:18px;border:2px solid currentColor;border-radius:4px 7px 4px 4px;overflow:hidden;background:#0006}
.wb .pn i{position:absolute;left:0;right:0;top:0;background:linear-gradient(180deg,#d6f2ff,#4cc9ff);transition:height .3s}

.ls.c,.ls.d{display:none!important}

</style>

function msg(t,ok){$('hist').innerHTML=ok===false?'<b style="color:var(--bad)">'+t+'</b>':t}

/* ---------- envio de comandos ---------- */
function enviar(canal,v){
  if(CFG.modo==='nuvem'&&cli&&cli.connected){cli.publish(CFG.x+'/car/cmd/'+canal,String(v));return}
  if(CFG.modo==='nuvem')return;
  // demonstração: aplica direto
  if(canal==='vidro'){const [i,p]=String(v).split(':');ALVO[+i]=+p;return}
  if(canal==='vidros'){for(let i=0;i<4;i++)ALVO[i]=+v;return}
  if(canal==='motor'){ST.motor=+v;if(!v){SIM.vel=0}return}
  if(canal==='volume'){ST.vol=Math.max(10,Math.min(100,Math.round(+v)));return}
  ST[canal]=+v;
}

/* ---------- segurança ---------- */
function checar(canal,v){
  if(canal==='motor'&&+v===1){
    if(ST.motor)return 'O carro já está ligado.';
    if(ST.obd.vel>0)return 'Não posso ligar com o carro em movimento.';
  }
  if(canal==='motor'&&+v===0&&ST.obd.vel>5)return 'Não desligo o motor em movimento.';
  if(canal==='portas'&&+v===0&&ST.obd.vel>5)return 'Não destranco em movimento.';
  return null;
}

/* ---------- interpretador de voz/texto ---------- */
const VERB={
  on:/\b(ligar|liga|ligue|acender|acende|acenda|ativar|ativa|ative|abrir? o som)\b/,
  off:/\b(desligar|desliga|desligue|apagar|apaga|apague|desativar|desativa|desative)\b/,
  open:/\b(abrir|abre|abra|descer|desce|desca|baixar|baixa|baixe)\b/,
  close:/\b(fechar|fecha|feche|subir|sobe|suba)\b/
};
function alvoVidros(s){
  const r=[];
  if(/motorista|dianteiro esquerdo|frente esquerd/.test(s))r.push(0);
  if(/passageiro|dianteiro direito|frente direit/.test(s))r.push(1);
  if(/traseiro esquerdo|tras esquerd/.test(s))r.push(2);
  if(/traseiro direito|tras direit/.test(s))r.push(3);
  if(!r.length){
    if(/traseir|tras\b/.test(s))return [2,3];
    if(/dianteir|frente/.test(s))return [0,1];
    if(/esquerd/.test(s))return [0,2];
    if(/direit/.test(s))return [1,3];
    return [0,1,2,3];
  }
  return r;
}
function interpretar(texto){
  const s=norm(texto),acoes=[];
  if(!s)return acoes;
  if(/\b(estacionar|estacionei|modo estacionamento|sair do carro)\b/.test(s)){
    return [{c:'farol',v:0,m:'Faróis apagados'},{c:'pisca',v:0,m:'Alerta desligado'},{c:'interna',v:0,m:'Luz interna apagada'},{c:'vidros',v:0,m:'Vidros fechados'},{c:'motor',v:0,m:'Motor desligado'},{c:'portas',v:1,m:'Portas trancadas'}];
  }
  const partes=s.split(/ e depois | depois | entao | e /);
  let ctx=null;
  for(let p of partes){
    p=p.trim().replace(/\bvideos?\b/g,'vidros');if(!p)continue;
    const off=VERB.off.test(p),on=VERB.on.test(p)&&!off;
    const abr=VERB.open.test(p),fch=VERB.close.test(p);
    let f=false;
    // motor / carro
    if(/\b(carro|motor|partida|ignicao)\b/.test(p)&&!/\bvidro|janela|porta|som|farol/.test(p)||/dar partida|pega o carro|pegar o carro/.test(p)){
      if(off){acoes.push({c:'motor',v:0,m:'Desligando o motor'});f=true}
      else if(on||/partida|pega/.test(p)){acoes.push({c:'motor',v:1,m:'Ligando o carro',conf:1});f=true}
    }
    if(!f&&/\b(farol|farois|luz alta|luz baixa|lanterna|luzes)\b/.test(p)&&!/interna|cabine|teto/.test(p)){
      let v=off?0:(/alto|alta|longo/.test(p)?2:1);
      acoes.push({c:'farol',v,m:v===0?'Faróis apagados':v===2?'Farol alto ligado':'Farol baixo ligado'});f=true;
    }
    if(!f&&/pisca|alerta|emergencia/.test(p)){const v=off?0:1;acoes.push({c:'pisca',v,m:v?'Pisca-alerta ligado':'Pisca-alerta desligado'});f=true}
    if(!f&&/interna|cabine|teto|luz de dentro/.test(p)){const v=off?0:1;acoes.push({c:'interna',v,m:v?'Luz interna ligada':'Luz interna apagada'});f=true}
    if(!f&&/\bporta|portas|trav|tranc|destranc|destrav/.test(p)){
      const des=/destranc|destrav|abrir|abre|abra/.test(p);
      acoes.push({c:'portas',v:des?0:1,m:des?'Portas destrancadas':'Portas trancadas'});f=true;
    }
    if(!f&&/vidro|janela/.test(p)){
      const idx=alvoVidros(p);let alvo=null;
      const mm=p.match(/(\d{1,3}) ?%/);
      if(mm)alvo=Math.min(100,+mm[1]);
      else if(/metade|meio/.test(p))alvo=50;
      else if(abr)alvo=100;else if(fch)alvo=0;
      if(alvo!==null){
        if(idx.length===4)acoes.push({c:'vidros',v:alvo,m:alvo===0?'Fechando todos os vidros':alvo===100?'Abrindo todos os vidros':'Vidros em '+alvo+'%'});
        else idx.forEach(i=>acoes.push({c:'vidro',v:i+':'+alvo,m:(alvo===0?'Fechando':'Abrindo')+' vidro '+NV[i]}));
        f=true;
      }
    }
    if(!f&&/volume|som|musica|radio|mudo|silenciar/.test(p)){
      const n=p.match(/(\d{1,3})/);
      if(/mudo|silenciar|silencio/.test(p)){acoes.push({c:'mudo',v:/tirar|sem|desativ/.test(p)?0:1,m:'Som no mudo'});f=true}
      else if(/volume/.test(p)){
        if(n){const vv=Math.max(10,Math.min(100,+n[1]));acoes.push({c:'volume',v:vv,m:'Volume '+vv+'%'})}
        else if(/aument|sobe|subir|suba|mais|alto|maior/.test(p))acoes.push({c:'volume',v:Math.min(100,ST.vol+10),m:'Volume '+Math.min(100,ST.vol+10)+'%'});
        else if(/diminu|baix|menos|reduz|menor/.test(p))acoes.push({c:'volume',v:Math.max(10,ST.vol-10),m:'Volume '+Math.max(10,ST.vol-10)+'%'});
        else continue;
        f=true;
      }else if(/aument|subir|sobe|suba/.test(p)&&/som/.test(p)){acoes.push({c:'volume',v:Math.min(100,ST.vol+10),m:'Volume '+Math.min(100,ST.vol+10)+'%'});f=true}
      else if(off){acoes.push({c:'som',v:0,m:'Som desligado'});f=true}
      else if(on||/tocar|toca|toque/.test(p)){acoes.push({c:'som',v:1,m:'Som ligado'});f=true}
    }
  }
  return acoes;
}
function executar(a,origem){
  const bloq=checar(a.c==='vidro'||a.c==='vidros'?'x':a.c,a.v);
  if(bloq)return {ok:false,m:bloq};
  enviar(a.c,a.v);return {ok:true,m:a.m};
}
function processarTexto(t,origem){
  const s=norm(t);
  if(PEND&&Date.now()-PENDT<15000){
    if(/^(sim|confirmo|confirmar|pode|isso|ok)\b/.test(s)){confirmar(true);return}
    if(/^(nao|cancelar|cancela|para)\b/.test(s)){confirmar(false);return}
  }
  PEND=null;$('conf').classList.remove('s');
  const ac=interpretar(t);
  if(!ac.length){
    if(CFG.ia&&CFG.k){msg('Pensando…');iaInterpretar(t).then(a=>{if(a.length)rodarAcoes(a,origem);else naoEntendi(t)}).catch(()=>naoEntendi(t));return []}
    naoEntendi(t);return [];
  }
  return rodarAcoes(ac,origem);
}
function naoEntendi(t){msg('Não entendi: <b>'+(t||'')+'</b>',false);falar('Não entendi')}
const IA_OK={farol:[0,1,2],pisca:[0,1],interna:[0,1],portas:[0,1],motor:[0,1],som:[0,1],mudo:[0,1]};
async function iaInterpretar(t){
  const prompt='Você controla um carro. Converta o pedido do usuário em um JSON array de ações, sem texto extra. Ações possíveis: {"c":"farol","v":0|1|2} (0 apagar,1 baixo,2 alto); {"c":"pisca","v":0|1} (pisca-alerta); {"c":"interna","v":0|1} (luz interna); {"c":"portas","v":0|1} (1 trancar,0 destrancar); {"c":"motor","v":0|1}; {"c":"som","v":0|1}; {"c":"volume","v":10..100}; {"c":"vidros","v":0..100} (% aberto, todos); {"c":"vidro","v":"i:%"} (i 0 motorista,1 passageiro,2 traseiro esq,3 traseiro dir). Se o pedido não for sobre o carro responda []. Pedido: '+JSON.stringify(t);
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key='+encodeURIComponent(CFG.k),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:0}})});
  const j=await r.json();
  const arr=JSON.parse(j.candidates[0].content.parts[0].text);
  const out=[];
  for(const a of (Array.isArray(arr)?arr:[])){
    if(a.c==='volume'){const v=Math.max(10,Math.min(100,Math.round(+a.v)));if(v)out.push({c:'volume',v,m:'Volume '+v+'%'})}
    else if(a.c==='vidros'){const v=Math.max(0,Math.min(100,+a.v));out.push({c:'vidros',v,m:'Vidros em '+v+'%'})}
    else if(a.c==='vidro'&&/^[0-3]:\d{1,3}$/.test(String(a.v)))out.push({c:'vidro',v:a.v,m:'Vidro '+NV[+String(a.v)[0]]})
    else if(IA_OK[a.c]&&IA_OK[a.c].includes(+a.v))out.push({c:a.c,v:+a.v,m:a.c+' '+a.v,conf:a.c==='motor'&&+a.v===1?1:0});
  }
  return out;
}
function rodarAcoes(ac,origem){
  const out=[],ok=[];
  for(const a of ac){
    if(a.conf&&origem!=='toque'){PEND=a;PENDT=Date.now();$('conf').classList.add('s');msg('<b>Ligar o carro?</b> Diga "sim" ou toque em Confirmar');falar('Confirma ligar o carro?');out.push('pendente');continue}
    const r=executar(a,origem);out.push(r.ok?'ok':'bloqueado');ok.push(r.m);
  }
  if(ok.length){msg('<b>'+ok.join(' • ')+'</b>');falar(ok.join('. '));vib(40)}
  render();return out;
}
function confirmar(sim){
  $('conf').classList.remove('s');
  if(!PEND)return;
  const a=PEND;PEND=null;
  if(!sim){msg('Cancelado');falar('Cancelado');return}
  const r=executar(a,'confirmado');msg('<b>'+r.m+'</b>',r.ok);falar(r.m);vib(60);render();
}

/* ---------- simulador ---------- */
function tick(dt){
  if(CFG.modo!=='demo')return;
  for(let i=0;i<4;i++){const d=ALVO[i]-ST.vidros[i];if(Math.abs(d)>0.5)ST.vidros[i]+=Math.sign(d)*Math.min(Math.abs(d),dt*35);else ST.vidros[i]=ALVO[i]}
  const o=ST.obd;o.ok=1;
  const alvoR=ST.motor?820+Math.random()*60:0;o.rpm+=(alvoR-o.rpm)*Math.min(1,dt*3);if(o.rpm<5)o.rpm=0;
  const alvoT=ST.motor?90:25;o.temp+=(alvoT-o.temp)*dt*.03;
  o.bat=ST.motor?14.1:12.4;
  o.vel=0;
}

/* ---------- MQTT ---------- */
function aplicarEstado(j){
  ['farol','pisca','interna','portas','motor','som','vol','mudo'].forEach(k=>{if(j[k]!=null)ST[k]=+j[k]});
  if(j.vidros)j.vidros.forEach((v,i)=>{ST.vidros[i]=+v});
  render();
}
$('tobd').onclick=()=>{vib(40);if(CFG.modo==='demo'){msg('No modo demonstração o OBD é simulado');return}
  const on=(ST.obd.est===1||ST.obd.est===2);enviar('obd',on?0:1);ST.obd.est=on?0:1;if(on)ST.obd.ok=0;msg('<b>'+(on?'Desconectando o OBD…':'Conectando ao adaptador OBD…')+'</b>');render()};
function aplicarObd(j){Object.assign(ST.obd,j);render()}
function setStatus(ok,t){$('dot').className='dot'+(ok?' ok':'');$('stx').textContent=t}
function conectar(){
  if(cli){try{cli.end(true)}catch(e){}cli=null}
  if(CFG.modo!=='nuvem'){setStatus(false,'Modo demonstração');return}
  if(!CFG.h||!CFG.x){setStatus(false,'Configure a nuvem');return}
  setStatus(false,'Conectando…');
  const go=()=>{
    const mh=CFG.h.match(/^(.*?):(\d+)$/),host=mh?mh[1]:CFG.h,porta=mh?mh[2]:'8884';
    cli=mqtt.connect('wss://'+host+':'+porta+'/mqtt',{username:CFG.u||undefined,password:CFG.p||undefined,reconnectPeriod:4000,clientId:'car_'+Math.random().toString(16).slice(2,8)});
    cli.on('connect',()=>{setStatus(true,'Conectado');cli.subscribe([CFG.x+'/car/state',CFG.x+'/car/obd',CFG.x+'/status'])});
    cli.on('close',()=>setStatus(false,'Sem conexão'));
    cli.on('message',(t,m)=>{try{const j=JSON.parse(m.toString());if(t.endsWith('/car/state'))aplicarEstado(j);else if(t.endsWith('/car/obd'))aplicarObd(j)}catch(e){}});
  };
  if(window.mqtt)return go();
  const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js';
  s.onload=go;s.onerror=()=>setStatus(false,'Falha ao carregar MQTT');document.head.appendChild(s);
}

}
bt.addEventListener('pointerdown',e=>{e.preventDefault();limparHold();vib(15);const t0=performance.now();
  hold=setInterval(()=>{hp=Math.min(1,(performance.now()-t0)/650);bt.style.setProperty('--p',(hp*360)+'deg');$('rp').style.strokeDashoffset=100-hp*100;if(hp>=1){limparHold();acionarMotor()}},30)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>bt.addEventListener(ev,limparHold));
bt.addEventListener('contextmenu',e=>e.preventDefault());
document.querySelectorAll('.wb').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;const v=ST.vidros[i]>=50?0:100;vib(35);enviar('vidro',i+':'+v);ALVO[i]=v;msg('<b>'+(v?'Abrindo':'Fechando')+' vidro '+NV[i]+'</b>');render()});
$('vFecha').onclick=()=>{vib(40);enviar('vidros',0);msg('<b>Fechando todos os vidros</b>');render()};
$('vAbre').onclick=()=>{vib(40);enviar('vidros',100);msg('<b>Abrindo todos os vidros</b>');render()};
document.querySelectorAll('.qv button').forEach(b=>b.onclick=()=>{
  const [g,v]=b.dataset.g.split(':');vib(40);
  if(g==='a')enviar('vidros',v);else(g==='d'?[0,1]:[2,3]).forEach(i=>enviar('vidro',i+':'+v));
  msg('<b>'+b.textContent+'</b>');render()});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.sheet').classList.remove('s'));
$('cy').onclick=()=>confirmar(true);$('cn').onclick=()=>confirmar(false);
$('vt').onclick=()=>{const t=document.querySelector('.stage').classList.toggle('top');$('vt').textContent=t?'Ver foto':'Ver de cima'};
$('txt').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){processarTexto(e.target.value,'texto');e.target.value=''}});
['Ligar faróis','Farol alto','Trancar portas','Abrir vidros','Ligar o som','Aumentar volume','Ligar o carro','Estacionar'].forEach(t=>{
  const b=document.createElement('button');b.textContent=t;b.onclick=()=>processarTexto(t,'texto');$('sug').appendChild(b)});
/* voz */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,AUTO=false,ARMADO=0,wl=null;
const WAKE=/^(?:(?:oi|ei|ola|ok|hey)\s+)?carr[oa]o?\b[\s,.!?]*(.*)$/;
function salvarCfg(){try{localStorage.setItem('fabcar2',JSON.stringify(CFG))}catch(e){}}
function tratarFala(txt){
  const n=norm(txt);if(!n)return;
  if(Date.now()<ARMADO){ARMADO=0;$('orb').classList.remove('arm');processarTexto(txt,'voz');return}
  const m=n.match(WAKE);
  if(!m){msg('<span style="opacity:.6">(ouvindo… diga "carro")</span>');return}
  const resto=m[1].trim();
  if(resto){bip(880,.08);processarTexto(resto,'voz')}
  else{bip(880,.1);ARMADO=Date.now()+8000;$('orb').classList.add('arm');msg('<b>Pode falar…</b>');vib(30);setTimeout(()=>{if(ARMADO&&Date.now()>=ARMADO){ARMADO=0;$('orb').classList.remove('arm');msg('Diga "carro" para chamar')}},8200)}
}
const ANDROID=/Android/i.test(navigator.userAgent);let ouvindo=false;
async function iniciarAuto(){
  if(!SR){msg('Este navegador não tem reconhecimento de voz. Abra no Chrome.',false);return}
  if(!window.isSecureContext){msg('Abra pelo link https:// do painel, não pelo arquivo.',false);return}
  msg('Ativando o microfone…');
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});st.getTracks().forEach(t=>t.stop())}
  catch(e){msg('Microfone bloqueado. Toque no cadeado ao lado do endereço, depois em Permissões, e permita o Microfone.',false);return}
  AUTO=true;CFG.auto=1;salvarCfg();$('autoS').textContent='ON';$('auto').classList.add('a');
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>wl=l).catch(()=>{})}catch(e){}
  ouvindo=false;escutar();
  setTimeout(()=>{if(AUTO&&!ouvindo)msg('O Chrome não iniciou a escuta. Feche apps que usam o microfone e toque de novo.',false)},4000);
}
function pararAuto(){
  AUTO=false;CFG.auto=0;salvarCfg();$('autoS').textContent='OFF';$('auto').classList.remove('a');$('orb').classList.remove('on','arm');
  try{wl&&wl.release();wl=null}catch(e){}
  if(rec){try{rec.stop()}catch(e){}}
  msg('Escuta desligada');
}
function escutar(){
  if(rec||!AUTO)return;
  const r=new SR();rec=r;r.lang='pt-BR';r.continuous=!ANDROID;r.interimResults=false;
  r.onstart=()=>{ouvindo=true;$('orb').classList.add('on');if(!ARMADO)msg('Diga <b>"carro"</b> e o comando')};
  r.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(!e.results[i].isFinal)continue;
      if(speechSynthesis.speaking||Date.now()-tFala<900)continue;
      tratarFala(e.results[i][0].transcript);
    }};
  r.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){AUTO=false;$('autoS').textContent='OFF';$('auto').classList.remove('a');msg('Permita o microfone (precisa de HTTPS).',false)}
    else if(e.error!=='no-speech'&&e.error!=='aborted')msg('Erro de voz: '+e.error,false)};
  r.onend=()=>{rec=null;ouvindo=false;$('orb').classList.remove('on');if(AUTO)setTimeout(escutar,ANDROID?150:350)};
  try{r.start()}catch(e){rec=null;if(AUTO)setTimeout(escutar,1000)}
}
$('auto').onclick=()=>AUTO?pararAuto():iniciarAuto();
document.addEventListener('visibilitychange',()=>{if(AUTO&&!document.hidden){try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>wl=l).catch(()=>{})}catch(e){}}});
$('orb').onclick=()=>{
  if(!SR){msg('Voz não suportada neste navegador. Use o Chrome ou digite o comando.',false);return}
  if(!window.isSecureContext){msg('Abra pelo link https:// do painel, não pelo arquivo.',false);return}
  if(AUTO){ARMADO=Date.now()+8000;bip(880,.1);$('orb').classList.add('arm');msg('<b>Pode falar…</b>');return}
  if(rec){rec.stop();return}
  rec=new SR();rec.lang='pt-BR';rec.interimResults=true;rec.maxAlternatives=1;
  rec.onstart=()=>{$('orb').classList.add('on');msg('Ouvindo…');vib(20)};
  rec.onresult=e=>{const r=e.results[e.results.length-1];msg('<b>'+r[0].transcript+'</b>');if(r.isFinal)processarTexto(r[0].transcript,'voz')};
  rec.onerror=e=>msg(e.error==='not-allowed'?'Permita o microfone (precisa de HTTPS).':'Erro de voz: '+e.error,false);
  rec.onend=()=>{$('orb').classList.remove('on');rec=null};
  try{rec.start()}catch(e){rec=null}
};
CFG.auto=0;
/* configurações */
function listarVozes(){const sel=$('cVoz');if(!sel)return;const l=speechSynthesis.getVoices();const pt=l.filter(v=>/^pt/i.test(v.lang)),out=l.filter(v=>!/^pt/i.test(v.lang));
  sel.innerHTML='<option value="">Automática (padrão do aparelho)</option>'+[...pt,...out].map(v=>'<option value="'+v.name.replace(/"/g,'&quot;')+'">'+v.name+' ('+v.lang+')'+'</option>').join('');sel.value=CFG.vozNome||''}
try{speechSynthesis.onvoiceschanged=listarVozes}catch(e){}
$('cVel').oninput=()=>{$('cVelT').textContent=(+$('cVel').value).toFixed(1)};$('cTom').oninput=()=>{$('cTomT').textContent=(+$('cTom').value).toFixed(1)};
$('cTest').onclick=()=>{const o=[CFG.voz,CFG.vozNome,CFG.vozVel,CFG.vozTom];CFG.voz=1;CFG.vozNome=$('cVoz').value;CFG.vozVel=$('cVel').value;CFG.vozTom=$('cTom').value;falar('Farol baixo ligado. Portas trancadas.');[CFG.voz,CFG.vozNome,CFG.vozVel,CFG.vozTom]=o};
$('bcfg').onclick=()=>{listarVozes();$('cVel').value=CFG.vozVel||1;$('cTom').value=CFG.vozTom||1;$('cVelT').textContent=(+$('cVel').value).toFixed(1);$('cTomT').textContent=(+$('cTom').value).toFixed(1);$('cH').value=CFG.h;$('cU').value=CFG.u;$('cP').value=CFG.p;$('cX').value=CFG.x;$('cN').value=CFG.nome||'';$('cV').checked=!!CFG.voz;$('cSom').checked=CFG.som!==0;$('cVib').checked=CFG.vib!==0;$('cI').checked=!!CFG.ia;$('cK').value=CFG.k;
  document.querySelectorAll('#sgM button').forEach(b=>b.classList.toggle('a',b.dataset.m===CFG.modo));$('shC').classList.add('s')};
document.querySelectorAll('#sgM button').forEach(b=>b.onclick=()=>{CFG.modo=b.dataset.m;document.querySelectorAll('#sgM button').forEach(x=>x.classList.toggle('a',x===b))});
$('cS').onclick=()=>{CFG.h=$('cH').value.trim().replace(/^(wss|mqtts|https):\/\//,'').replace(/\/.*$/,'');CFG.u=$('cU').value.trim();CFG.p=$('cP').value;CFG.x=$('cX').value.trim().replace(/^\/+|\/+$/g,'');CFG.nome=$('cN').value.trim()||'Gol GTI';CFG.voz=$('cV').checked?1:0;CFG.vozNome=$('cVoz').value;CFG.vozVel=$('cVel').value;CFG.vozTom=$('cTom').value;CFG.som=$('cSom').checked?1:0;CFG.vib=$('cVib').checked?1:0;CFG.ia=$('cI').checked?1:0;CFG.k=$('cK').value.trim();
  try{localStorage.setItem('fabcar2',JSON.stringify(CFG))}catch(e){}
  $('shC').classList.remove('s');conectar();render()};

function relogio(){const d=new Date();$('clk').textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});$('dt').textContent=d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'})}
relogio();setInterval(relogio,15000);
(function(){const ph=$('ph'),img=ph.querySelector('img');ph.style.setProperty('--car','url("'+img.src+'")')})();

if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
window.FABCAR={ST,SIM,ALVO,interpretar,norm,processarTexto,confirmar,render,tick,enviar};
let ult=performance.now();
setInterval(()=>{const n=performance.now();tick((n-ult)/1000);ult=n;render()},100);
conectar();render();
</script>
